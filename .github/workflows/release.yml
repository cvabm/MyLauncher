name: Build and publish release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1'

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle)
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$tag" == "v${version}" ]] || { echo 'Release tag must match versionName'; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=MyLauncher-${tag}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password secret}"
          : "${ANDROID_KEY_ALIAS:?Missing key alias secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password secret}"
          umask 077
          keystore_path="$RUNNER_TEMP/mylauncher-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Package and verify APK
        env:
          APK_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/${APK_NAME}.apk"
          "$ANDROID_HOME/build-tools/33.0.1/apksigner" verify --verbose "dist/${APK_NAME}.apk"
          cd dist
          sha256sum "${APK_NAME}.apk" > "${APK_NAME}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove signing key from runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mylauncher-release.jks"
